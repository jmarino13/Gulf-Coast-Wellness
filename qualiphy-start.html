<!DOCTYPE html>
<html>

<head>

<title>Begin Your Gulf Coast Wellness Evaluation</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
background:#FAF7F2;
font-family:Inter,Arial,sans-serif;
color:#102A43;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.card {

background:white;
padding:45px;
border-radius:28px;
width:420px;
box-shadow:0 25px 60px rgba(16,42,67,.12);

}

h1 {

font-family:Georgia,serif;
font-size:38px;

}

input, select {

width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;

}

button {

width:100%;
background:#C8A96A;
color:white;
border:none;
padding:16px;
border-radius:50px;
font-size:18px;
cursor:pointer;

}

</style>

</head>


<body>


<div class="card">

<h1>
Begin Your Journey
</h1>

<p>
Complete your information to begin your physician-directed wellness evaluation.
</p>


<input id="first" placeholder="First Name">

<input id="last" placeholder="Last Name">

<input id="email" placeholder="Email">

<input id="phone" placeholder="Phone Number">


<select id="state">

<option value="">
Select Your State
</option>

<option value="LA">
Louisiana
</option>

<option value="TX">
Texas
</option>

<option value="FL">
Florida
</option>

<option value="CA">
California
</option>

</select>


<button onclick="startExam()">
Start Evaluation
</button>


</div>



<script>

async function startExam(){


const data = {

first_name:
document.getElementById("first").value,

last_name:
document.getElementById("last").value,

email:
document.getElementById("email").value,

phone_number:
document.getElementById("phone").value,

state:
document.getElementById("state").value

};


const response =
await fetch("/api/qualiphy/start",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

});


if(response.ok){

window.location.href="/evaluation-started.html";

}
else{

alert("Unable to start evaluation. Please try again.");

}


}


</script>


</body>

</html>
